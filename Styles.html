<style>
    :root{--bg:#07101d;--panel:#0e1a2a;--panel2:#111f32;--line:#22334a;--text:#eef5ff;--muted:#91a3ba;--orange:#f7931a;--cyan:#5fd4ff;--green:#39d98a;--red:#ff6b7a;--yellow:#ffd166;--shadow:0 18px 55px rgba(0,0,0,.32)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 600px at 10% -5%,rgba(247,147,26,.16),transparent 60%),radial-gradient(900px 650px at 100% 5%,rgba(95,212,255,.12),transparent 58%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    button,select,input{font:inherit}.app{max-width:1280px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.coin{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffb14c,var(--orange));color:#15100a;font-size:25px;font-weight:950;box-shadow:0 8px 25px rgba(247,147,26,.28)}h1{font-size:24px;margin:0}.subtitle{color:var(--muted);font-size:13px;line-height:1.5;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#13243a;color:var(--text);border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--orange),#ffb14c);color:#17100a;border-color:transparent}.btn:disabled{opacity:.5;cursor:not-allowed}

    .hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.card{background:linear-gradient(145deg,rgba(17,31,50,.96),rgba(11,23,38,.96));border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.metric.primary{border-color:rgba(247,147,26,.5);background:linear-gradient(145deg,rgba(247,147,26,.17),rgba(17,31,50,.96))}.label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:900}.value{font-size:25px;font-weight:950;margin-top:7px;letter-spacing:-.5px}.delta{font-size:12px;font-weight:850;margin-top:6px}.detail{font-size:11px;color:var(--muted);line-height:1.4;margin-top:5px}.good{color:var(--green)}.bad{color:var(--red)}.neutral{color:var(--yellow)}.grade{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid currentColor}.grade.a,.grade.b{color:var(--green)}.grade.c{color:var(--yellow)}.grade.d,.grade.f{color:var(--red)}
