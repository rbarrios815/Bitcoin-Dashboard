<script>
  const $=id=>document.getElementById(id);
  const state={data:null,range:'all',view:'basket',item:null,stale:'include',unit:'sats',charts:{},foodBenchmark:null,benchmarkLoading:false,benchmarkStart:'',benchmarkEnd:''};
  const COLORS=['#f7931a','#5fd4ff','#39d98a','#ffd166','#ff6b7a','#9d8cff','#5ce1c7','#ff9e64','#72a7ff','#d6a7ff'];

  function appCall(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));}
  function money(v){return Number.isFinite(Number(v))?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v):'—';}
  function sats(v){return Number.isFinite(Number(v))?new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(v)+' sats':'—';}
  function pct(a,b){return Number.isFinite(Number(a))&&Number(a)!==0&&Number.isFinite(Number(b))?(Number(b)/Number(a)-1)*100:NaN;}
  function pctText(v){return Number.isFinite(v)?(v>=0?'+':'')+v.toFixed(2)+'%':'—';}
  function dateText(v){return v?new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';}
  function escapeHtml(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function setStatus(text,error=false){const el=$('status');el.textContent=text;el.className='status show'+(error?' error':'');}
  function hideStatus(){setTimeout(()=>$('status').classList.remove('show'),800);}
  function destroy(name){if(state.charts[name]){state.charts[name].destroy();state.charts[name]=null;}}

  function rangeStart(){const now=new Date();if(state.range==='all')return null;if(state.range==='ytd')return new Date(now.getFullYear(),0,1);const d=new Date(now);d.setDate(d.getDate()-Number(state.range)+1);return d;}
  function filteredSnapshots(){
    const start=rangeStart();
    return (state.data?.snapshots||[]).filter(s=>!start||new Date(s.ts)>=start).map(s=>{
      if(state.stale==='include')return s;
      const fresh=(s.items||[]).filter(x=>!x.isStale&&x.valid);
      const expected=state.data.basketDefinition.itemCount;
      const basketUsd=fresh.length===expected?fresh.reduce((n,x)=>n+Number(x.usd),0):null;
      const basketSats=Number.isFinite(basketUsd)&&Number(s.btcUsd)>0?basketUsd/Number(s.btcUsd)*100000000:null;
      return {...s,items:fresh,basketUsd,basketSats,freshCount:fresh.length,staleCount:0,missingCount:Math.max(0,expected-fresh.length)};
    });
  }
  function positiveValue(value){return value!==null&&value!==undefined&&typeof value!=='boolean'&&String(value).trim()!==''&&Number.isFinite(Number(value))&&Number(value)>0;}
  function usableBoundaries(rows,field){const valid=rows.filter(x=>positiveValue(x[field]));return valid.length?{first:valid[0],last:valid[valid.length-1]}:null;}
  function basketAnswer(rows,definition,now=Date.now()){
    const expected=Number(definition?.itemCount||0),ids=(definition?.items||[]).map(x=>x.id).sort();
    const ordered=rows.filter(x=>Number.isFinite(new Date(x.ts).getTime())&&new Date(x.ts).getTime()<=now).slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    if(!ordered.length||!expected||ids.length!==expected||new Set(ids).size!==expected)return {status:'empty'};
    const complete=row=>{
      const valid=(row.items||[]).filter(x=>x.valid&&positiveValue(x.usd)&&positiveValue(x.sats));
      return positiveValue(row.basketUsd)&&positiveValue(row.basketSats)&&positiveValue(row.btcUsd)&&Number(row.missingCount)===0&&valid.length===expected&&JSON.stringify(valid.map(x=>x.itemId).sort())===JSON.stringify(ids);
    };
    const last=ordered[ordered.length-1];
    if(!complete(last))return {status:'incomplete',last};
    const first=ordered.find(complete);
    if(!first||new Date(first.ts).getTime()===new Date(last.ts).getTime())return {status:'insufficient',last};
    const change=(Number(first.basketSats)/Number(last.basketSats)-1)*100;
    const dollarChange=(Number(first.basketUsd)/Number(last.basketUsd)-1)*100;
    const carried=[first,last].some(x=>Number(x.staleCount)>0||(x.items||[]).some(i=>i.isStale));
    const outdated=now-new Date(last.ts).getTime()>48*60*60*1000;
    const unknownValidation=[first,last].some(x=>(x.items||[]).some(i=>i.validationKnown===false));
    return {status:'ready',first,last,change,dollarChange,carried,outdated,unknownValidation,provisional:carried||outdated||unknownValidation};
  }
  function itemData(){return (state.data?.itemSeries||[]).find(x=>x.id===state.item)||null;}
  function filteredItemHistory(){const item=itemData(),start=rangeStart();return (item?.history||[]).filter(x=>(!start||new Date(x.ts)>=start)&&(state.stale==='include'||!x.isStale));}

  function render(){
    if(!state.data)return;
    $('itemControl').style.display=state.view==='item'?'grid':'none';
    renderHero();renderMainChart();renderContribution();renderDecomposition();renderTable();renderQuality();renderReferences();renderFoodBenchmark();
    $('updated').textContent='Updated '+new Date(state.data.generatedAt).toLocaleString()+' · '+escapeHtml(state.data.location||'');
  }

  function renderHero(){
    const hero=$('hero');
    if(state.view==='item'){
      const item=itemData(),history=filteredItemHistory(),bounds=usableBoundaries(history,'usd');
      if(!item||!bounds){hero.innerHTML='<div class="card metric"><div class="empty">No comparable item history.</div></div>';$('insight').textContent='Choose another item or range.';return;}
      const u=pct(bounds.first.usd,bounds.last.usd),s=pct(bounds.first.sats,bounds.last.sats),share=10000/Number(bounds.last.sats)*100;
      hero.innerHTML=metric('10,000 sats buys',share.toFixed(2)+'%','of one '+item.description,s<=0?'good':'bad','primary')+metric('Latest item price',money(bounds.last.usd),pctText(u)+' in dollars',u<=0?'good':'bad')+metric('Latest sats price',sats(bounds.last.sats),pctText(s)+' · lower is better',s<=0?'good':'bad')+metric('Latest observation',bounds.last.isStale?'Carried':'Fresh',dateText(bounds.last.ts),bounds.last.isStale?'neutral':'good');
      $('insight').textContent=item.name+' changed '+pctText(u)+' in dollars and '+pctText(s)+' in sats over this range. '+(s<0?'Bitcoin purchasing power improved against this item.':s>0?'Bitcoin purchasing power declined against this item.':'The sats price was unchanged.');
      return;
    }
    const answer=basketAnswer(filteredSnapshots(),state.data.basketDefinition);
    if(answer.status!=='ready'){
      const title=answer.status==='incomplete'?'Latest basket is incomplete':answer.status==='insufficient'?'One complete observation so far':'No comparable basket history';
      const detail=answer.status==='incomplete'?'The latest observation cannot price every fixed package. No more-or-fewer claim is shown.':'At least two complete observations of the same basket are needed.';
      hero.innerHTML=metric('Does Bitcoin buy more groceries?',title,detail,'neutral','answer');
      $('insight').textContent='Choose a wider range or include carried-forward values to inspect available history. Missing packages never count as a cheaper basket.';return;
    }
    const {first,last,change,dollarChange,provisional}=answer,lastShare=10000/last.basketSats*100,firstShare=10000/first.basketSats*100;
    const unchanged=Math.abs(change)<0.005,headline=unchanged?'Bitcoin buys the same groceries':`Bitcoin buys ${Math.abs(change).toFixed(2)}% ${change>0?'more':'fewer'} groceries`;
    const dollarUnchanged=Math.abs(dollarChange)<0.005;
    const dollarHeadline=dollarUnchanged?'Dollars buy the same groceries':`Dollars buy ${Math.abs(dollarChange).toFixed(2)}% ${dollarChange>0?'more':'fewer'} groceries`;
    const qualifier=provisional?'Provisional comparison':'Compared with the start of this range';
    const reasons=[answer.carried?'a boundary uses carried-forward grocery prices':'',answer.outdated?'the latest snapshot is over 48 hours old':'',answer.unknownValidation?'historical source or product-match validation is unknown':''].filter(Boolean);
    hero.innerHTML=metric(qualifier,headline,`${dateText(first.ts)} → ${dateText(last.ts)} · same ${state.data.basketDefinition.itemCount} packages`,provisional?'neutral':unchanged?'neutral':change>0?'good':'bad','answer')+metric('Dollar purchasing power',dollarHeadline,`${dateText(first.ts)} → ${dateText(last.ts)} · same ${state.data.basketDefinition.itemCount} packages`,provisional?'neutral':dollarUnchanged?'neutral':dollarChange>0?'good':'bad')+metric('10,000 sats buys',lastShare.toFixed(2)+'% of a basket','Previously '+firstShare.toFixed(2)+'% of the same basket','neutral')+metric('Basket price in dollars',money(last.basketUsd),pctText(pct(first.basketUsd,last.basketUsd))+' over this range','neutral')+metric('Basket price in sats',sats(last.basketSats),pctText(pct(first.basketSats,last.basketSats))+' over this range','neutral');
    $('insight').textContent=(reasons.length?'Provisional: '+reasons.join('; ')+'. ':'')+'A satoshi (sat) is a unit of Bitcoin. Holding the same number of sats now buys '+(unchanged?'the same amount':Math.abs(change).toFixed(2)+'% '+(change>0?'more':'fewer')+' groceries')+' against this measured basket. This is a historical comparison, not a forecast.';
  }
  function metric(label,value,delta,cls,extra=''){return `<div class="card metric ${extra}"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div><div class="delta ${cls}">${escapeHtml(delta)}</div></div>`;}

  function renderMainChart(){
    destroy('main');const ctx=$('mainChart');let labels=[],values=[],label='',note='';
    if(state.view==='item'){
      const item=itemData(),history=filteredItemHistory();labels=history.map(x=>dateText(x.ts));
      if(state.unit==='usd'){values=history.map(x=>x.usd);label=item?.name+' in dollars';note='Nominal package price in dollars.';}
      else if(state.unit==='sats'){values=history.map(x=>x.sats);label=item?.name+' in sats';note='Lower means greater Bitcoin purchasing power.';}
      else{const base=history.find(x=>Number(x.usd)>0)?.usd;values=history.map(x=>base?x.usd/base*100:null);label=item?.name+' index';note='First visible item price = 100.';}
      $('mainTitle').textContent=(item?.name||'Item')+' over time';
    }else{
      const rows=filteredSnapshots();labels=rows.map(x=>dateText(x.ts));
      if(state.unit==='usd'){values=rows.map(x=>x.basketUsd);label='Fixed basket (USD)';note='Sum of one standardized package per configured grocery item.';}
      else if(state.unit==='sats'){values=rows.map(x=>x.basketSats);label='Fixed basket (sats)';note='Lower means 1 BTC buys more of the same basket.';}
      else{const first=rows.find(x=>Number(x.basketUsd)>0),usdBase=first?.basketUsd,satsBase=first?.basketSats;values=rows.map(x=>state.indexSeries==='sats'?(satsBase&&x.basketSats?x.basketSats/satsBase*100:null):(usdBase&&x.basketUsd?x.basketUsd/usdBase*100:null));label='Fixed basket index';note='First complete visible basket = 100.';}
      $('mainTitle').textContent='Fixed basket over time';
    }
    state.charts.main=new Chart(ctx,{type:'line',data:{labels,datasets:[{label,data:values,borderColor:'#f7931a',backgroundColor:'rgba(247,147,26,.14)',fill:true,tension:.25,spanGaps:false,pointRadius:values.length>60?0:2,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#eef5ff'}}},scales:{x:{ticks:{color:'#91a3ba',maxTicksLimit:7},grid:{color:'rgba(34,51,74,.35)'}},y:{ticks:{color:'#91a3ba'},grid:{color:'rgba(34,51,74,.55)'}}}}});
    $('chartNote').textContent=note;
  }

  function renderContribution(){
    destroy('contribution');const rows=filteredSnapshots(),latest=[...rows].reverse().find(x=>Number(x.basketUsd)>0);
    const items=(latest?.items||[]).filter(x=>x.valid&&Number(x.usd)>0);
    state.charts.contribution=new Chart($('contributionChart'),{type:'doughnut',data:{labels:items.map(x=>x.name),datasets:[{data:items.map(x=>x.usd),backgroundColor:COLORS,borderColor:'#111f32',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{color:'#91a3ba',boxWidth:10,font:{size:9}}}}}});
  }

  function renderDecomposition(){
    destroy('decomposition');const bounds=usableBoundaries(filteredSnapshots(),'basketUsd');
    if(!bounds){$('decompositionNote').textContent='Not enough complete basket history.';return;}
    const a=bounds.first,b=bounds.last,usdEffect=(b.basketUsd/a.basketUsd-1)*100,btcEffect=(a.btcUsd/b.btcUsd-1)*100,net=(b.basketSats/a.basketSats-1)*100;
    state.charts.decomposition=new Chart($('decompositionChart'),{type:'bar',data:{labels:['Basket USD effect','BTC/USD effect','Observed sats change'],datasets:[{data:[usdEffect,btcEffect,net],backgroundColor:['#ff6b7a','#5fd4ff','#f7931a']}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#91a3ba',callback:v=>v+'%'},grid:{color:'rgba(34,51,74,.5)'}},y:{ticks:{color:'#91a3ba'},grid:{display:false}}}}});
    $('decompositionNote').textContent=`Basket USD factor × BTC purchasing-power factor produces the sats result. Observed change: ${pctText(net)}.`;
  }

  function renderTable(){
    const start=rangeStart(),rows=[];
    (state.data.itemSeries||[]).forEach(item=>{const h=item.history.filter(x=>!start||new Date(x.ts)>=start).filter(x=>state.stale==='include'||!x.isStale);if(!h.length)return;const a=h[0],b=h[h.length-1],u=pct(a.usd,b.usd),s=pct(a.sats,b.sats);rows.push({item,a,b,u,s});});
    rows.sort((x,y)=>x.s-y.s);
    $('itemRows').innerHTML=rows.map(x=>`<tr><td><b>${escapeHtml(x.item.name)}</b><div class="ref-meta">${escapeHtml(x.item.description)}</div></td><td>${money(x.a.usd)}</td><td>${money(x.b.usd)}</td><td class="${x.u<=0?'good':'bad'}">${pctText(x.u)}</td><td>${sats(x.a.sats)}</td><td>${sats(x.b.sats)}</td><td class="${x.s<=0?'good':'bad'}">${pctText(x.s)}</td><td><span class="badge ${x.b.isStale?'stale':''}">${x.b.isStale?'Carried':'Fresh'}</span></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No item history in this range.</td></tr>';
  }

  function renderQuality(){
    const r=state.data.reliability||{},grade=String(r.grade||'Building'),success=Number(r.refreshSuccessPct||0),tracked=Math.min(Number(r.trackingDays||0),Number(r.requiredTrackingDays||30)),required=Number(r.requiredTrackingDays||30);
    $('quality').innerHTML=`<div class="q"><span>Current ≤48h</span><b class="good">${Number(r.currentItems||0)}/${Number(r.expectedItems||0)}</b></div><div class="q"><span>Older</span><b class="neutral">${Number(r.outdatedItems||0)}</b></div><div class="q"><span>Missing</span><b class="bad">${Number(r.missingItems||0)}</b></div><div class="q"><span>30-day success</span><b>${Number(r.expectedRefreshes||0)?success.toFixed(1)+'%':'—'} (${Number(r.successfulRefreshes||0)}/${Number(r.expectedRefreshes||0)})</b></div><div class="q"><span>Track record</span><b>${tracked}/${required} days</b></div><div class="q"><span>Reliability grade</span><b class="${grade==='A'||grade==='B'?'good':'neutral'}">${escapeHtml(grade)}</b></div>`;
    if(!Number(r.trackingDays||0))$('qualityWarning').textContent=`Thirty-day reliability tracking begins ${r.trackingStartDate||'on the first logged grocery schedule (methodology v3)'}.`;
    else if(!r.mature)$('qualityWarning').textContent=`Building the 30-day track record. An A requires ${Number(r.expectedItems||0)}/${Number(r.expectedItems||0)} items within 48 hours, no missing items, and at least 95% scheduled-refresh success.`;
    else if(grade==='A')$('qualityWarning').textContent='A earned: the basket is fully current and the last 30 days met the 95% scheduled-refresh standard.';
    else $('qualityWarning').textContent=`${r.scheduleComplete?'':'Incomplete schedule coverage. '}An A requires ${Number(r.expectedItems||0)}/${Number(r.expectedItems||0)} items within 48 hours, no missing items, and at least 95% scheduled-refresh success. Current success: ${success.toFixed(1)}%.`;
  }

  function renderReferences(){
    const refs=Object.values(state.data.references||{});
    $('references').innerHTML=refs.map(ref=>{const rows=ref.history||[],last=rows[rows.length-1];if(!last)return'';return `<div class="ref"><div><div class="ref-name">${escapeHtml(ref.name)}</div><div class="ref-meta">${escapeHtml(ref.description)} · ${escapeHtml(last.source||'')}</div></div><div class="ref-value">${money(last.usd)}<br>${sats(last.sats)}${last.isStale?'<br><span class="neutral">carried</span>':''}</div></div>`;}).join('')||'<div class="empty">No reference history.</div>';
  }

  function foodEvidence(benchmark,snapshots,start=null,now=new Date(),selectedStart='',selectedEnd=''){
    if(benchmark?.error)return {error:benchmark.error};
    const points=benchmark?.points||[];
    if(!points.length)return {error:'No published monthly benchmark is available.'};
    const days={}, conflicts=new Set();
    for(const row of snapshots||[]){
      const time=new Date(row.ts);
      if(!Number.isFinite(time.getTime())||time>now)continue;
      const day=time.toISOString().slice(0,10);
      if(!days[day]||new Date(days[day].ts)<time)days[day]=row;
      else if(days[day].ts===row.ts&&Number(days[day].btcUsd)!==Number(row.btcUsd))conflicts.add(day);
    }
    const availableDays=Object.keys(days).sort();
    if(!availableDays.length)return {error:'No recorded BTC/USD history to align with BLS.'};
    const earliest=availableDays[0].slice(0,7), latest=points[points.length-1].month;
    let month=earliest>points[0].month?earliest:points[0].month;
    const floor=start?new Date(start):null;
    const rows=[];
    while(month<=latest){
      const first=new Date(month+'-01T00:00:00Z'),next=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,1));
      if(!floor||first>=floor){
        const p=points.find(x=>x.month===month),count=new Date(next-1).getUTCDate();
        let sum=0,valid=0;
        for(let n=1;n<=count;n++){
          const day=month+'-'+String(n).padStart(2,'0'),r=days[day];
          if(r&&!conflicts.has(day)&&positiveValue(r.btcUsd)){sum+=Number(r.btcUsd);valid++;}
        }
        rows.push({month,cpi:p?.cpi??null,btcUsd:valid===count?sum/count:null,days:valid,expectedDays:count});
      }
      month=next.toISOString().slice(0,7);
    }
    const visible=rows.filter(r=>(!selectedStart||r.month>=selectedStart)&&(!selectedEnd||r.month<=selectedEnd));
    rows.splice(0,rows.length,...visible);
    const lagged=latest<new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-1,1)).toISOString().slice(0,7);
    if(rows.length<2)return {rows,lagged,error:'At least two whole published months are needed in this range. Try All history.'};
    const missing=rows.filter(r=>!positiveValue(r.cpi)||!positiveValue(r.btcUsd));
    if(missing.length)return {rows,lagged,error:'Comparison withheld: missing CPI or incomplete daily BTC samples in '+missing.map(r=>r.month+' ('+r.days+'/'+r.expectedDays+' BTC days)').join(', ')+'. No missing months are bridged.'};
    const first=rows[0],last=rows[rows.length-1];
    return {rows,first,last,lagged,btcChange:(last.btcUsd/first.btcUsd*first.cpi/last.cpi-1)*100,dollarChange:(first.cpi/last.cpi-1)*100};
  }
  function renderFoodBenchmark(){
    const target=$('foodBenchmarkResult');
    if(!state.foodBenchmark)return;
    const result=foodEvidence(state.foodBenchmark,state.data?.snapshots,rangeStart(),new Date(),state.benchmarkStart,state.benchmarkEnd);
    let text=result.error||`${result.first.month} → ${result.last.month}: Bitcoin food buying power ${pctText(result.btcChange)}; dollar food buying power ${pctText(result.dollarChange)}. Both use BLS food-at-home CPI for the identical months.`;
    if(result.lagged)text+=' Publication lag: the latest BLS month is older than the previous calendar month.';
    text+=' CPI is published after its observation month; it is not a live grocery quote. The BLS API does not supply individual release dates; retrieval time is not the release date, and these are current published values, not historical vintages.';
    if(state.foodBenchmark.retrievedAt)text+=' Retrieved '+dateText(state.foodBenchmark.retrievedAt)+'.';
    text+=' BTC/USD comes from recorded Sheet samples; this does not independently validate the shopping-search prices. Historical basket source/match validation can be unknown. No predictive claim is made.';
    target.textContent=text;
    if(result.rows?.length){
      const table=document.createElement('div');table.className='table-wrap';
      table.innerHTML='<table><thead><tr><th>Month</th><th>Official CPI</th><th>Recorded mean BTC/USD</th><th>BTC sample days</th></tr></thead><tbody>'+result.rows.map(r=>`<tr><td>${escapeHtml(r.month)}</td><td>${positiveValue(r.cpi)?Number(r.cpi).toFixed(3):'Missing'}</td><td>${positiveValue(r.btcUsd)?money(r.btcUsd):'Incomplete'}</td><td>${r.days}/${r.expectedDays}</td></tr>`).join('')+'</tbody></table>';
      target.appendChild(table);
    }
  }
  async function loadFoodBenchmark(){
    if(state.foodBenchmark||state.benchmarkLoading)return;
    state.benchmarkLoading=true;
    $('foodBenchmarkResult').textContent='Loading official BLS monthly evidence…';
    try{state.foodBenchmark=await appCall('getFoodAtHomeBenchmark');
      const points=state.foodBenchmark.points||[], firstDay=(state.data?.snapshots||[]).map(x=>x.ts).sort()[0];
      const months=points.filter(p=>!firstDay||p.month>=firstDay.slice(0,7)).map(p=>p.month);
      for(const id of ['benchmarkStart','benchmarkEnd'])$(id).innerHTML=months.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
      state.benchmarkStart=months[0]||'';state.benchmarkEnd=months[months.length-1]||'';
      $('benchmarkStart').value=state.benchmarkStart;$('benchmarkEnd').value=state.benchmarkEnd;}
    catch(e){state.foodBenchmark={error:'Official food benchmark unavailable. Reload to retry.'};}
    finally{state.benchmarkLoading=false;renderFoodBenchmark();}
  }

  function wire(){
    $('benchmarkStart').onchange=e=>{state.benchmarkStart=e.target.value;renderFoodBenchmark();};
    $('benchmarkEnd').onchange=e=>{state.benchmarkEnd=e.target.value;renderFoodBenchmark();};
    $('foodBenchmark').ontoggle=()=>{if($('foodBenchmark').open)loadFoodBenchmark();};
    $('range').onchange=e=>{state.range=e.target.value;render();};
    $('view').onchange=e=>{state.view=e.target.value;render();};
    $('item').onchange=e=>{state.item=e.target.value;render();};
    $('stale').onchange=e=>{state.stale=e.target.value;render();};
    $('units').onclick=e=>{if(!e.target.dataset.unit)return;state.unit=e.target.dataset.unit;[...$('units').querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b===e.target));renderMainChart();};
    $('methodBtn').onclick=()=>{$('method').open=true;$('method').scrollIntoView({behavior:'smooth'});};
  }
  async function load(){try{setStatus('Loading verified purchasing-power history…');state.data=await appCall('getPurchasingPowerDashboardData');const items=state.data.itemSeries||[];$('item').innerHTML=items.map(x=>`<option value="${escapeHtml(x.id)}">${escapeHtml(x.name)}</option>`).join('');state.item=state.item||items[0]?.id||null;render();hideStatus();}catch(e){setStatus(e.message||String(e),true);}}
  wire();load();
</script>
